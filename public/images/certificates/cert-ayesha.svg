<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" role="img" aria-label="Sample NAVTTC Certificate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b62be"/>
      <stop offset="100%" stop-color="#2f4798"/>
    </linearGradient>
  </defs>
  <rect width="900" height="636" fill="url(#bg)"/>
  <rect x="18" y="18" width="864" height="600" fill="none" stroke="#2f4798" stroke-width="3" rx="8"/>
  <rect x="30" y="30" width="840" height="576" fill="none" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <rect x="30" y="30" width="840" height="78" fill="url(#band)"/>
  <circle cx="78" cy="69" r="24" fill="#fff"/>
  <text x="78" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2f4798">NAV</text>
  <text x="450" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">National Vocational &amp; Technical Training Commission</text>
  <text x="450" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">Government of Pakistan</text>
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#001a33">Certificate of Qualification</text>
  <text x="450" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526080">This is to certify that</text>
  <text x="450" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#2f4798">Ayesha Khan</text>
  <line x1="260" y1="242" x2="640" y2="242" stroke="#c7d2e5" stroke-width="1"/>
  <text x="450" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526080">has successfully completed</text>
  <text x="450" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f1729">National Vocational Certificate Level-3</text>
  <text x="450" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Electrical Technician</text>
  <text x="450" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#526080">Government College of Technology, Lahore</text>
  <rect x="120" y="420" width="660" height="90" rx="8" fill="#fff" stroke="#e2e8f5"/>
  <text x="160" y="455" font-family="Arial, sans-serif" font-size="11" fill="#9aabbf">CERTIFICATE NO.</text>
  <text x="160" y="478" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1729">NAVTTC/CERT/2024/004821</text>
  <text x="480" y="455" font-family="Arial, sans-serif" font-size="11" fill="#9aabbf">REGISTRATION NO.</text>
  <text x="480" y="478" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f1729">REG-LHR-2023-11842</text>
  <text x="160" y="555" font-family="Arial, sans-serif" font-size="12" fill="#526080">Issue Date: 18 Jun 2024</text>
  <text x="620" y="555" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#526080">Awarding Body: NAVTTC</text>
  <rect x="760" y="520" width="70" height="70" rx="6" fill="#fff" stroke="#2f4798" stroke-width="2"/>
  <text x="795" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#2f4798">QR</text>
